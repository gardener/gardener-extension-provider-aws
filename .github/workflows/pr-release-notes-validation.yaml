name: Validate release-notes from PRs
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-release-notes:
    uses: gardener/cc-utils/.github/workflows/validate-release-notes.yaml@9a9c4f544c072143b4c95b8f32b935332c47389d # v1
    permissions:
      pull-requests: read
    with:
      pull-request-body: ${{ github.event.pull_request.body }}
